
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090d">
  <title>V-Tik Pro — Short Videos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a href="#" class="brand">V<span>-TIK</span></a>

  <div class="search-box">
    <input type="search" id="searchInput" placeholder="Search videos...">
    <button id="clearSearch" type="button">✕</button>
  </div>

  <div class="header-actions">
    <button id="createTop" class="create-btn">＋ Create</button>
    <button class="avatar" id="headerAvatar">TR</button>
  </div>
</header>

<aside class="sidebar">
  <a href="#" class="active">⌂ Home</a>
  <a href="#videoFeed">▣ Explore</a>
  <a href="#about">ⓘ About</a>
  <a href="#privacy">♧ Privacy</a>
  <p>© 2026 V-Tik</p>
</aside>

<main class="main-content">
  <h2 class="feed-heading">Discover videos</h2>

  <div id="videoFeed" class="video-feed"></div>

  <div id="emptyState" class="empty-state">
    <div class="empty-icon">▶</div>
    <h2>No videos found</h2>
    <p>Upload a video or try another search.</p>
    <button id="emptyCreate" class="create-btn">＋ Upload video</button>
  </div>
</main>

<nav class="mobile-nav">
  <a href="#">⌂<span>Home</span></a>
  <a href="#videoFeed">▣<span>Discover</span></a>
  <button id="mobileCreate">＋</button>
  <a href="#videoFeed">♡<span>Following</span></a>
  <a href="#" id="mobileProfile">●<span>Profile</span></a>
</nav>

<!-- Upload modal -->
<div class="modal" id="createModal">
  <div class="modal-content">
    <button class="close-btn" id="closeCreate">×</button>
    <h2>Create a video</h2>
    <p>Select a video from your device.</p>

    <label class="upload-area" for="videoFile">
      <span>＋</span>
      <strong>Choose video</strong>
      <small>MP4, WebM or MOV</small>
    </label>

    <input type="file" id="videoFile" accept="video/*" hidden>

    <p id="selectedFile">No video selected</p>

    <textarea id="videoCaption" placeholder="Write a caption..."></textarea>
    <button id="postVideo" class="create-btn full-btn">Post video</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
